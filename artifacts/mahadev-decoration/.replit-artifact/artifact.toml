kind = "web"
previewPath = "/"
title = "Mahadev Decoration"
description = "A cinematic Hindi-first event decoration website for Mahadev Decoration in Begusarai, helping customers explore celebration styles, see real work, and request a booking."
version = "1.0.0"
id = "artifacts/mahadev-decoration"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20545

[services.development]
run = "pnpm --filter @workspace/mahadev-decoration run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mahadev-decoration", "run", "build" ]
serve = "static"
publicDir = "artifacts/mahadev-decoration/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20545"
BASE_PATH = "/"
